<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<title>HORMUZ·LIVE</title>
<style>
:root{
  --bg:#05090d; --surface:#0b1117; --surface2:#0e161e; --line:#16212b; --line2:#1e2c38;
  --ink:#d9e4ec; --bright:#f4f9fc; --dim:#5b6a76; --faint:#38434d;
  --flash:#5ea2ff; --pending:#ffb020; --ver:#34d399; --danger:#ff4a3d;
  --disp:#ffb020; --lead:#8f7bff;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --disp-face:'Arial Black','Helvetica Neue',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.55; max-width:560px; margin:0 auto;
  padding:0 14px calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono)}

/* ── HERO: THREAT FIELD ─────────────────────────────────────────── */
.hero{position:relative; padding:26px 4px 18px; overflow:hidden}
.field{
  position:absolute; inset:-60px -80px auto -80px; height:300px; pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 30%, var(--tcolor-glow) 0%, transparent 70%);
  opacity:.55; animation:breathe var(--pulse,6s) ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.30}50%{opacity:.72}}
.masthead{display:flex; justify-content:space-between; align-items:baseline; position:relative}
.wordmark{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.28em; color:var(--dim)}
.wordmark b{color:var(--ink)}
.stamp{font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.06em; text-align:right}
.threatword{
  position:relative; font-family:var(--disp-face); font-weight:900; text-transform:uppercase;
  font-size:clamp(52px,17vw,84px); line-height:.94; letter-spacing:-.01em;
  color:var(--tcolor); margin-top:16px;
  text-shadow:0 0 42px var(--tcolor-glow);
}
.threatmeta{position:relative; display:flex; align-items:center; gap:10px; margin-top:8px; font-family:var(--mono); font-size:11px; letter-spacing:.1em}
.dir{font-weight:700; color:var(--tcolor)}
.scale{display:flex; gap:4px; margin-left:auto}
.scale i{width:16px; height:5px; border-radius:2px; background:var(--line2)}
.scale i.on{background:var(--tcolor)}
.uaeline{
  position:relative; margin-top:16px; padding:13px 14px;
  border:1px solid var(--line2); border-left:3px solid var(--tcolor);
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  border-radius:0 8px 8px 0;
}
.uaeline .k{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.22em; color:var(--dim); margin-bottom:5px}
.uaeline .v{font-size:15px; line-height:1.5; color:var(--bright); font-weight:500}
.uaeline .act{margin-top:8px; font-size:13px; color:var(--tcolor); font-weight:600}
.uaeline .act::before{content:"→ "}
.chips{position:relative; display:flex; gap:8px; margin-top:12px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; display:flex; flex-direction:column; gap:1px; padding:7px 11px; border:1px solid var(--line2); border-radius:7px; background:var(--surface)}
.chip .l{font-family:var(--mono); font-size:8px; letter-spacing:.18em; color:var(--dim); font-weight:700}
.chip .d{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink)}
.chip.hot .d{color:var(--danger)}
.chip.warm .d{color:var(--pending)}

/* ── SIGNALS ────────────────────────────────────────────────────── */
.lanehead{display:flex; align-items:baseline; gap:10px; margin:26px 2px 4px}
.lanehead h2{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.3em; color:var(--bright)}
.lanehead .live{width:7px;height:7px;border-radius:50%;background:var(--danger); animation:blink 1.4s steps(2) infinite; align-self:center}
@keyframes blink{50%{opacity:.15}}
.lanehead .sub{font-family:var(--mono); font-size:9px; color:var(--faint); letter-spacing:.08em; margin-left:auto}
.ladder{font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--faint); margin:0 2px 12px}
.ladder b{font-weight:600}
.ladder .lf{color:var(--flash)} .ladder .lp{color:var(--pending)} .ladder .lv{color:var(--ver)} .ladder .ld{color:var(--disp)}

.sig{
  border:1px solid var(--line); border-left-width:3px; border-radius:8px;
  background:var(--surface); margin-bottom:10px; padding:12px 13px 11px; position:relative;
}
.sig.flash{border-left-color:var(--flash); animation:sigpulse 2.1s ease-in-out infinite}
.sig.pending{border-left-color:var(--pending); animation:sigpulse 4.2s ease-in-out infinite}
.sig.ver,.sig.ver2{border-left-color:var(--ver); animation:none}
.sig.disputed{
  border-left:none; animation:none;
  border-top:3px solid transparent;
  border-image:repeating-linear-gradient(45deg,var(--disp) 0 8px,#20160a 8px 16px) 1;
  border-radius:0;
}
@keyframes sigpulse{0%,100%{box-shadow:inset 3px 0 0 -1px transparent}50%{box-shadow:-4px 0 14px -6px currentColor}}
.sig.flash{color:var(--flash)} .sig.pending{color:var(--pending)}
.sig *{color:var(--ink)}
.sigtop{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:7px}
.tier{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.12em; padding:2px 7px; border-radius:4px}
.tier.flash{color:var(--flash); border:1px solid var(--flash); background:transparent}
.tier.pending{color:var(--pending); border:1px solid var(--pending); background:transparent}
.tier.ver{color:var(--ver); border:1px solid var(--ver); background:transparent}
.tier.ver2{color:#04140d; background:var(--ver); border:1px solid var(--ver)}
.tier.disputed{color:#140e02; background:var(--disp); border:1px solid var(--disp)}
.reg{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--dim); font-weight:600}
.age{font-family:var(--mono); font-size:10px; color:var(--dim); margin-left:auto}
.age.live::before{content:""; display:inline-block; width:6px;height:6px;border-radius:50%;background:var(--flash); margin-right:5px; animation:blink 1.2s steps(2) infinite; vertical-align:1px}
.claim{font-size:15px; line-height:1.45; color:var(--bright); font-weight:500}
.sig.ver2 .claim{font-weight:600}

/* convergence meter — the signature */
.meter{display:flex; align-items:center; gap:6px; margin-top:10px}
.slots{display:flex; gap:4px}
.slot{display:flex; flex-direction:column; align-items:center; gap:3px}
.slot i{width:26px; height:7px; border-radius:2px; background:var(--line2)}
.slot.on i{background:var(--slotc,var(--ver)); box-shadow:0 0 8px -1px var(--slotc,var(--ver))}
.slot em{font-style:normal; font-family:var(--mono); font-size:7px; letter-spacing:.08em; color:var(--faint)}
.slot.on em{color:var(--dim)}
.mlabel{font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--dim); margin-left:auto; text-align:right; line-height:1.4}
.mlabel .up{color:var(--ver); font-weight:700}
.mlabel .dn{color:var(--dim); font-weight:700}
.mlabel .hold{color:var(--faint); font-weight:700}

/* provenance & sources */
.prov{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.leadchip{font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.12em; color:var(--lead); border:1px dashed var(--lead); border-radius:4px; padding:2px 7px}
.stale{font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.12em; color:var(--danger); border:1px solid var(--danger); border-radius:4px; padding:2px 7px; animation:blink 1.6s steps(2) infinite}
.srcs{margin-top:9px; border-top:1px solid var(--line); padding-top:0; max-height:0; overflow:hidden; transition:max-height .25s ease, padding .25s ease}
.sig.open .srcs{max-height:560px; padding-top:9px}
.src{display:flex; gap:8px; align-items:baseline; font-family:var(--mono); font-size:10px; padding:3px 0; color:var(--dim)}
.src b{color:var(--ink); font-weight:600; min-width:96px}
.src .med{font-size:8px; letter-spacing:.1em; color:var(--faint); border:1px solid var(--line2); border-radius:3px; padding:1px 4px}
.src .dt{margin-left:auto; color:var(--faint)}
.src.staled b, .src.staled .dt{color:var(--danger)}
.signote{margin-top:8px; font-size:12px; color:var(--dim); line-height:1.5}
.tapline{font-family:var(--mono); font-size:8px; letter-spacing:.14em; color:var(--faint); margin-top:8px}

/* disputed split */
.vs{display:grid; grid-template-columns:1fr; gap:0; margin-top:8px}
.vsblock{padding:9px 11px; border:1px solid var(--line2); background:var(--surface2)}
.vsblock:first-child{border-radius:7px 7px 0 0; border-bottom:none}
.vsblock:last-child{border-radius:0 0 7px 7px}
.vsdivider{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.2em; color:var(--disp); padding:4px 0}
.vsdivider::before,.vsdivider::after{content:""; flex:1; height:1px; background:repeating-linear-gradient(90deg,var(--disp) 0 6px,transparent 6px 12px); opacity:.5}
.vsblock .who{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--dim); margin-bottom:3px}
.vsblock .what{font-size:13px; color:var(--bright)}
.dropped{font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--faint); text-align:center; margin:4px 0 2px; line-height:1.6}

/* ── DEPTH ON DEMAND ────────────────────────────────────────────── */
details{border:1px solid var(--line); border-radius:8px; background:var(--surface); margin-top:12px; overflow:hidden}
summary{
  list-style:none; cursor:pointer; padding:13px 14px;
  display:flex; align-items:center; gap:10px;
  font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.24em; color:var(--dim);
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; margin-left:auto; font-size:14px; color:var(--faint); font-weight:400}
details[open] summary::after{content:"–"}
details[open] summary{color:var(--ink); border-bottom:1px solid var(--line)}
summary .cnt{font-family:var(--mono); font-size:9px; color:var(--faint); letter-spacing:.1em; font-weight:400}
.dbody{padding:4px 14px 14px}
.item{padding:10px 0; border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .h{display:flex; align-items:baseline; gap:8px; margin-bottom:3px; flex-wrap:wrap}
.item .h b{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--bright); letter-spacing:.03em}
.item .h .st{font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.1em; padding:2px 6px; border-radius:3px}
.item .h .dt{font-family:var(--mono); font-size:9px; color:var(--faint); margin-left:auto}
.item p{font-size:12.5px; color:var(--dim); line-height:1.55}
.st.red{color:var(--danger); border:1px solid var(--danger)}
.st.amber{color:var(--pending); border:1px solid var(--pending)}
.st.green{color:var(--ver); border:1px solid var(--ver)}
.st.grey{color:var(--dim); border:1px solid var(--line2)}
.ledres{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.1em; margin-left:auto}
.ledres.right{color:var(--ver)} .ledres.wrong{color:var(--danger)} .ledres.open{color:var(--pending)} .ledres.partial{color:var(--lead)}

/* scenarios */
.scen{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
.scen:last-child{border-bottom:none}
.scen .pct{font-family:var(--mono); font-weight:700; font-size:16px; min-width:46px; line-height:1.1}
.scen.risk .pct{color:var(--pending)} .scen.tail .pct{color:var(--danger)} .scen.base .pct{color:var(--ver)}
.scen .lab{font-size:13px; color:var(--bright); font-weight:600; margin-bottom:3px; line-height:1.35}
.scen p{font-size:12px; color:var(--dim); line-height:1.5}

/* escalation trace */
.tracewrap{padding:6px 0 2px}
.tracecap{font-family:var(--mono); font-size:9px; letter-spacing:.12em; color:var(--dim); display:flex; justify-content:space-between; margin-bottom:6px}
.tracecap b{color:var(--danger); font-weight:700}
svg.trace{width:100%; height:82px; overflow:visible; display:block}
svg.trace .base{fill:none; stroke:var(--dim); stroke-width:1.4; opacity:.7}
svg.trace .hot{fill:none; stroke:var(--danger); stroke-width:2.2}

.recallrule{font-size:12px; color:var(--dim); line-height:1.6; padding:10px 0 4px}
.recallrule b{color:var(--lead); font-family:var(--mono); font-size:10px; letter-spacing:.06em}
.recallrule .ok{color:var(--ver)}

/* footer */
.foot{margin-top:22px; font-family:var(--mono); font-size:9px; color:var(--faint); letter-spacing:.06em; line-height:1.8; text-align:center}
.foot b{color:var(--dim)}

/* ── FULL FEED: everything gathered, deduped, uncapped ──────────── */
.feedsub{font-family:var(--mono); font-size:9px; color:var(--faint); letter-spacing:.06em; margin:0 2px 10px}
.feed{margin-top:2px}
.frow{display:flex; gap:9px; align-items:flex-start; padding:9px 2px; border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.ftier{font-family:var(--mono); font-size:8px; font-weight:700; letter-spacing:.06em; padding:2px 0; border-radius:3px; flex-shrink:0; width:54px; text-align:center}
.frow.flash .ftier{color:var(--flash); border:1px solid var(--flash)}
.frow.pending .ftier{color:var(--pending); border:1px solid var(--pending)}
.frow.ver .ftier,.frow.ver2 .ftier{color:var(--ver); border:1px solid var(--ver)}
.frow.disputed .ftier{color:var(--disp); border:1px solid var(--disp)}
.flane{font-family:var(--mono); font-size:8px; letter-spacing:.04em; color:var(--dim); flex-shrink:0; width:88px; padding-top:3px; line-height:1.3}
.fbody{flex:1; min-width:0}
.fclaim{font-size:13px; color:var(--ink); line-height:1.42}
.fmeta{font-family:var(--mono); font-size:9px; color:var(--faint); margin-top:3px; letter-spacing:.02em}
.fmeta .eng{color:var(--dim)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>

<div id="app"></div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');

/* threat grammar: color + pulse rate per level 0–4 */
const LEVELS = [
  { c:'#2dd28c', pulse:'9s'   },  /* CALM      */
  { c:'#b8cf5a', pulse:'7s'   },  /* GUARDED   */
  { c:'#ffb020', pulse:'5s'   },  /* ELEVATED  */
  { c:'#ff7a45', pulse:'3.2s' },  /* SEVERE    */
  { c:'#ff4a3d', pulse:'1.8s' }   /* CRITICAL  */
];
const L = LEVELS[D.threat.level] || LEVELS[2];
document.documentElement.style.setProperty('--tcolor', L.c);
document.documentElement.style.setProperty('--tcolor-glow', L.c + '33');
document.documentElement.style.setProperty('--pulse', L.pulse);

const MEDIUMS = ['OFF','WIRE','OSINT','STATE','SOC'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function meter(sig){
  const present = new Set((sig.sources||[]).filter(s=>!s.stale).map(s=>s.medium));
  const n = present.size;
  const slotColor = sig.tier==='flash' ? 'var(--flash)' : sig.tier==='pending' ? 'var(--pending)' : 'var(--ver)';
  const slots = MEDIUMS.map(m =>
    `<div class="slot ${present.has(m)?'on':''}" style="--slotc:${slotColor}"><i></i><em>${m}</em></div>`).join('');
  const mm = sig.momentum==='gaining' ? '<span class="up">▲ gaining</span>'
           : sig.momentum==='fading'  ? '<span class="dn">▼ fading</span>'
           : '<span class="hold">— holding</span>';
  const ind = sig.tier==='disputed' ? 'in conflict'
            : n===0 ? 'no live primary'
            : n===1 ? '1 medium · not independent'
            : `${n} mediums present · relays share origin`;
  return `<div class="meter"><div class="slots">${slots}</div><div class="mlabel">${ind}<br>${mm}</div></div>`;
}

function srcRows(sig){
  if(!sig.sources || !sig.sources.length) return '';
  const rows = sig.sources.map(s=>
    `<div class="src ${s.stale?'staled':''}"><b>${esc(s.name)}</b><span class="med">${s.medium}·${esc(s.lang)}</span><span class="dt">${esc(s.date)}${s.stale?' ⚠':''}</span></div>`).join('');
  return `<div class="srcs">${rows}${sig.note?`<div class="signote">${esc(sig.note)}</div>`:''}</div><div class="tapline">TAP FOR PRIMARIES + READ</div>`;
}

function signalCard(sig){
  const tierLabel = {flash:'FLASH',pending:'PENDING',ver:'VER',ver2:'VER²',disputed:'DISPUTED'}[sig.tier];
  let inner = `
    <div class="sigtop">
      <span class="tier ${sig.tier}">${tierLabel}</span>
      <span class="reg">${esc(sig.region)}</span>
      <span class="age ${sig.live?'live':''}">${esc(sig.age)}</span>
    </div>
    <div class="claim">${esc(sig.claim)}</div>`;
  if(sig.tier==='disputed' && sig.conflict){
    inner += `<div class="vs">
      <div class="vsblock"><div class="who">${esc(sig.conflict.a.who)}</div><div class="what">${esc(sig.conflict.a.what)}</div></div>
      <div class="vsdivider">VS — NOT AVERAGED</div>
      <div class="vsblock"><div class="who">${esc(sig.conflict.b.who)}</div><div class="what">${esc(sig.conflict.b.what)}</div></div>
    </div>`;
    const chips2 = [];
    if(sig.via_recall) chips2.push('<span class="leadchip">LEAD · RECALL ENGINE — NOT A SOURCE</span>');
    if(chips2.length) inner += `<div class="prov">${chips2.join('')}</div>`;
    inner += `${sig.note?`<div class="signote">${esc(sig.note)}</div>`:''}`;
  } else {
    inner += meter(sig);
    const chips = [];
    if(sig.via_recall) chips.push('<span class="leadchip">LEAD · RECALL ENGINE — NOT A SOURCE</span>');
    if(sig.stale_primary) chips.push('<span class="stale">⚠ STALE PRIMARY — DATED ' + esc((sig.sources[0]||{}).date||'') + '</span>');
    if(chips.length) inner += `<div class="prov">${chips.join('')}</div>`;
    inner += srcRows(sig);
  }
  return `<article class="sig ${sig.tier}" data-id="${sig.id}">${inner}</article>`;
}

function items(list, ledger){
  return list.map(it=>{
    if(ledger){
      return `<div class="item"><div class="h"><b>${esc(it.call)}</b><span class="st grey">${esc(it.made)}</span><span class="ledres ${it.res.toLowerCase()}">${esc(it.res)}</span></div><p>${esc(it.p)}</p></div>`;
    }
    const st = it.st ? `<span class="st ${it.stc||'grey'}">${esc(it.st)}</span>` : '';
    const dt = it.dt ? `<span class="dt">${esc(it.dt)}</span>` : '';
    return `<div class="item"><div class="h"><b>${esc(it.t)}</b>${st}${dt}</div><p>${esc(it.p)}</p></div>`;
  }).join('');
}

function feedRows(list){
  return (list||[]).map(f=>
    `<div class="frow ${f.tier}"><span class="ftier">${f.tier.toUpperCase()}</span><span class="flane">${esc(f.lane)}<br>${esc(f.region||'')}</span><div class="fbody"><div class="fclaim">${esc(f.claim)}</div><div class="fmeta">${esc(f.src)} · ${esc(f.date)}${f.eng?` · <span class="eng">${esc(f.eng)}</span>`:''}</div></div></div>`
  ).join('');
}

function scenarios(list){
  return list.map(s=>`<div class="scen ${s.kind}"><div class="pct">${esc(s.prob)}</div><div><div class="lab">${esc(s.lab)}</div><p>${esc(s.p)}</p></div></div>`).join('');
}

function traceSVG(t){
  if(!t) return '';
  return `<div class="tracewrap">
    <div class="tracecap"><span>${esc(t.label)} · ${esc(t.days)}</span><b>${esc(t.tail)}</b></div>
    <svg class="trace" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
      <polyline class="base" points="${esc(t.base)}"></polyline>
      <polyline class="hot" points="${esc(t.hot)}"></polyline>
    </svg>
  </div>`;
}

app.innerHTML = `
  <header class="hero">
    <div class="field"></div>
    <div class="masthead">
      <div class="wordmark">HORMUZ<b>·LIVE</b></div>
      <div class="stamp">DAY ${D.meta.day} · ${esc(D.meta.phase)}<br>${esc(D.meta.updated)}</div>
    </div>
    <div class="threatword">${esc(D.threat.word)}</div>
    <div class="threatmeta">
      <span class="dir">${esc(D.threat.direction)}</span>
      <div class="scale">${[0,1,2,3,4].map(i=>`<i class="${i<=D.threat.level?'on':''}"></i>`).join('')}</div>
    </div>
    <div class="uaeline">
      <div class="k">YOUR LINE — UAE</div>
      <div class="v">${esc(D.threat.uae_line)}</div>
      <div class="act">${esc(D.threat.action)}</div>
    </div>
    <div class="chips">
      <div class="chip ${D.strait.hot?'hot':''}"><span class="l">STRAIT</span><span class="d">${esc(D.strait.status)}</span></div>
      ${D.deadlines.map(d=>`<div class="chip ${d.hot?'hot':'warm'}"><span class="l">${esc(d.label)}</span><span class="d">${esc(d.date)}</span></div>`).join('')}
    </div>
  </header>

  <section>
    <div class="lanehead"><span class="live"></span><h2>SIGNALS</h2><span class="sub">unconfirmed lives here — never above</span></div>
    <div class="ladder"><b class="lf">FLASH</b> raw → <b class="lp">PENDING</b> → <b class="lv">VER</b> one source → <b class="lv">VER²</b> multi-source, independent mediums → <b class="ld">DISPUTED</b> shown as conflict. Nothing tops out on one source. Dead rumors drop.</div>
    ${D.signals.map(signalCard).join('')}
    <div class="dropped">${esc(D.dropped_note)}</div>
  </section>

  <section>
    <div class="lanehead"><h2>FULL FEED</h2><span class="sub">everything gathered · deduped</span></div>
    <div class="feedsub">The strip above is the curated summary — this is the complete surface. ${(D.feed||[]).length} items · deduped · nothing filtered by verification (tier is a label, not a gate).</div>
    <div class="feed">${feedRows(D.feed)}</div>
