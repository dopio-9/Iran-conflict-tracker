<!DOCTYPE html>
<html lang="en" data-theme="water">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORMUZ TRACKER — Dark Water / Pressure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Azeret+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ─── THEME TOKENS ─────────────────────────────────────────── */
  :root[data-theme="water"]{
    --bg:#06121a; --surface:#0a1d29; --surface2:#0c2230; --line:#16374a; --grid:#0e2836;
    --text:#cfe6ee; --bright:#ffffff; --mute:#5e8398;
    --accent:#62d8e8; --alarm:#ff5e4d; --warn:#ffb347; --ok:#3ddc97; --hot:#ff5e4d; --info:#62d8e8;
    --display:'Archivo',sans-serif; --mono:'Azeret Mono',monospace;
    --gridshow:block; --tlabel:"SOUNDINGS"; --radar:1;
  }
  :root[data-theme="pressure"]{
    --bg:#0d0c0a; --surface:#161410; --surface2:#1b1813; --line:#2a261e; --grid:transparent;
    --text:#ece5d8; --bright:#fffaf0; --mute:#857c6a;
    --accent:#ffae33; --alarm:#ff4f3d; --warn:#ffae33; --ok:#9dc08b; --hot:#ff4f3d; --info:#ffae33;
    --display:'Space Grotesk',sans-serif; --mono:'Spline Sans Mono',monospace;
    --gridshow:none; --tlabel:"READINGS"; --radar:0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#03080b;display:flex;justify-content:center;padding:20px 8px;
    font-family:var(--mono);transition:background .4s}
  .phone{width:min(430px,100%);min-height:860px;background:var(--bg);color:var(--text);
    box-shadow:0 24px 70px rgba(0,0,0,.7);overflow:hidden;position:relative;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:46px 46px;transition:background-color .4s,color .4s}

  /* ─── HEADER ───────────────────────────────────────────────── */
  .top{padding:14px 16px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 95%,transparent),color-mix(in srgb,var(--surface) 60%,transparent));
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;backdrop-filter:blur(6px)}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .brand{font-size:9px;letter-spacing:.2em;color:var(--mute)}
  h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;margin-top:4px;line-height:1}
  h1 b{color:var(--accent)}
  .sub{font-size:9px;color:var(--mute);letter-spacing:.12em;margin-top:5px}
  .daycol{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .day{font-family:var(--display);font-weight:800;font-size:11px;color:var(--bright);
    background:var(--line);border-radius:4px;padding:3px 8px;white-space:nowrap}
  .tchip{font-family:var(--mono);font-size:7.5px;font-weight:600;letter-spacing:.1em;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:4px;padding:2px 6px;white-space:nowrap}
  /* flip control */
  .flip{display:flex;align-items:center;gap:0;margin-top:8px;border:1px solid var(--line);
    border-radius:6px;overflow:hidden;width:fit-content}
  .flip button{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.14em;
    padding:5px 11px;border:none;cursor:pointer;background:transparent;color:var(--mute);transition:.2s}
  .flip button.on{background:var(--accent);color:var(--bg)}
  .flip .ico{font-size:10px;color:var(--mute);padding:0 6px}

  /* thesis banner — level-driven (--pc set per level) */
  .banner{display:flex;align-items:center;gap:9px;padding:9px 16px;--pc:var(--ok);
    background:color-mix(in srgb,var(--pc) 12%,transparent);border-bottom:1px solid var(--line)}
  .banner.warn{--pc:var(--warn)}
  .banner.alarm{--pc:var(--alarm)}
  .banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--pc);flex-shrink:0;
    box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 70%,transparent);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .banner .b-txt{font-size:10px;line-height:1.4;color:var(--text)}
  .banner .b-txt b{color:var(--pc);font-weight:600;letter-spacing:.04em}

  /* tabs */
  .tabs{display:flex;gap:2px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;
    padding:7px 12px;border:none;cursor:pointer;background:transparent;color:var(--mute);
    border-radius:5px 5px 0 0;white-space:nowrap;transition:.2s}
  .tab.on{background:var(--accent);color:var(--bg)}
  .tab .n{opacity:.6;font-size:8px;margin-left:3px}

  /* ─── CONTENT SHELL ────────────────────────────────────────── */
  .wrap{padding:12px 14px 28px}
  .panel{display:none}
  .panel.on{display:block;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .card.flag{border-left:3px solid var(--hot)}
  .chead{font-size:9px;letter-spacing:.18em;color:var(--mute);padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;align-items:center}
  .chead .stamp{font-weight:600}
  .cbody{padding:11px 13px}

  .tag{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.1em;
    padding:2px 6px;border-radius:3px;display:inline-block}
  .t-flash{background:color-mix(in srgb,var(--alarm) 18%,transparent);color:var(--alarm)}
  .t-ver2{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .t-ver{background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok)}
  .t-pending{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .t-disputed{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .t-geo{background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--text)}

  /* ─── WIRE ─────────────────────────────────────────────────── */
  .wirehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .wirehead .meta{font-size:9px;color:var(--mute);letter-spacing:.1em}
  .filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .fbtn{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:4px 8px;border-radius:4px;
    border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:.15s}
  .fbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .ping{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;
    background:var(--surface);overflow:hidden;cursor:pointer;transition:.15s}
  .ping:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .ping.flashrail{border-left:3px solid var(--alarm)}
  .ping.disprail{border-left:3px solid var(--accent)}
  .ping.pendrail{border-left:3px solid var(--warn)}
  .ping.verrail{border-left:3px solid var(--ok)}
  .gutter{width:46px;flex-shrink:0;padding:11px 0;text-align:center;border-right:1px solid var(--line);
    background:var(--bg)}
  .gutter .g-t{font-size:9px;color:var(--text);font-weight:600}
  .gutter .g-d{font-size:7.5px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
  .pbody{flex:1;padding:10px 12px;min-width:0}
  .ptags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;align-items:center}
  .ptags .src{font-size:8px;color:var(--mute);letter-spacing:.08em;margin-left:auto}
  .ptitle{font-size:12px;line-height:1.45;color:var(--bright)}
  .ptitle b{font-weight:600}
  .pfull{font-size:11px;line-height:1.6;color:var(--mute);margin-top:8px;
    border-top:1px solid var(--line);padding-top:8px;display:none}
  .ping.open .pfull{display:block}
  .pfull .why{color:var(--text);display:block;margin-top:6px;font-style:italic}

  /* ─── NOW (signatures) ─────────────────────────────────────── */
  .sig-water{display:block}
  [data-theme="pressure"] .sig-water{display:none}
  [data-theme="water"] .sig-pressure{display:none}
  .channel .chart{position:relative;height:122px;background:var(--surface2)}
  .land{position:absolute;background:#13242e}
  [data-theme="pressure"] .land{background:#242019}
  .land.iran{top:0;left:0;right:0;height:34px;clip-path:polygon(0 0,100% 0,100% 40%,72% 100%,38% 62%,0 78%)}
  .land.oman{bottom:0;left:0;right:0;height:30px;clip-path:polygon(0 100%,100% 100%,100% 30%,55% 0,22% 55%,0 22%)}
  .landlbl{position:absolute;font-size:8px;letter-spacing:.22em;color:var(--mute)}
  .tss{position:absolute;left:0;right:0;top:52px;height:26px;
    background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--alarm) 16%,transparent) 0 14px,transparent 14px 26px);
    border-top:1px dashed var(--alarm);border-bottom:1px dashed var(--alarm)}
  .tsslbl{position:absolute;top:58px;width:100%;text-align:center;font-size:8.5px;letter-spacing:.24em;color:var(--alarm);font-weight:600}
  .cor{position:absolute;left:6%;right:6%;height:0;border-top:1.5px dashed}
  .cor.warn{border-color:var(--warn)} .cor.alarm{border-color:var(--alarm)} .cor.ok{border-color:var(--ok)}
  .corlbl{position:absolute;font-size:6.5px;letter-spacing:.1em;font-weight:600}
  .corlbl.warn{color:var(--warn)} .corlbl.alarm{color:var(--alarm)} .corlbl.ok{color:var(--ok)}
  .vessel{position:absolute;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--warn)}
  .vessel.uturn::after{content:"⮌";position:absolute;left:9px;top:-6px;color:var(--warn);font-size:10px}
  .sweep{position:absolute;inset:0;background:conic-gradient(from 0deg at 84% 50%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70deg);animation:rot 7s linear infinite;mix-blend-mode:screen}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* pressure dials */
  .dials{display:flex}
  .dial{flex:1;padding:14px 6px 12px;text-align:center;border-right:1px solid var(--line)}
  .dial:last-child{border-right:none}
  .needlebox{height:28px;position:relative;margin-bottom:7px}
  .arc{position:absolute;left:50%;bottom:0;width:46px;height:23px;transform:translateX(-50%);
    border:2px solid var(--line);border-bottom:none;border-radius:46px 46px 0 0}
  .pin{position:absolute;left:50%;bottom:0;width:2px;height:21px;background:var(--hot);transform-origin:bottom center}
  .dial .dv{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.04em}
  .dial .dl{font-size:8px;letter-spacing:.12em;color:var(--mute);display:block;margin-top:2px}

  /* shared gauges row */
  .gauges{display:flex;border-top:1px solid var(--line)}
  .gauge{flex:1;padding:10px 5px;text-align:center;border-right:1px solid var(--line)}
  .gauge:last-child{border-right:none}
  .gauge .gv{font-family:var(--display);font-weight:800;font-size:15px}
  .gauge .gl{font-size:8px;letter-spacing:.12em;color:var(--mute);display:block;margin-top:2px}
  .c-alarm{color:var(--alarm)} .c-warn{color:var(--warn)} .c-ok{color:var(--ok)} .c-accent{color:var(--accent)} .c-mute{color:var(--mute)}

  .statline{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .statline:last-child{border-bottom:none}
  .statline .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
  .statline .sl-k{font-size:11px;color:var(--bright);font-weight:600}
  .statline .sl-v{font-size:10.5px;color:var(--mute);line-height:1.5;margin-top:2px}

  /* ─── VERIFY ───────────────────────────────────────────────── */
  .claimsrc{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:8px;font-weight:800;color:var(--text);flex-shrink:0;letter-spacing:.02em}
  .claimsrc .who{font-size:11px;color:var(--bright);font-weight:600}
  .claimsrc .handle{font-size:9px;color:var(--mute)}
  .claimsrc .reach{margin-left:auto;text-align:right;font-size:8.5px;color:var(--mute);letter-spacing:.08em}
  .claimquote{padding:11px 13px;font-size:11px;line-height:1.55;color:var(--text);font-style:italic;border-bottom:1px solid var(--line)}
  .verdict{padding:0 13px}
  .vrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vbadge{flex-shrink:0;width:74px;font-size:8px;font-weight:600;letter-spacing:.08em;text-align:center;
    padding:4px 0;border-radius:4px;height:fit-content}
  .v-confirmed{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .v-disputed{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .v-unverified{background:color-mix(in srgb,var(--alarm) 16%,transparent);color:var(--alarm)}
  .v-partial{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .vtext{flex:1}
  .vtext .vc{font-size:11px;color:var(--bright);line-height:1.4}
  .vtext .vn{font-size:10px;color:var(--mute);line-height:1.5;margin-top:4px}
  .vtext .vs{font-size:8.5px;color:var(--mute);letter-spacing:.08em;margin-top:5px}
  .vtext .vs b{color:var(--ok);font-weight:600}

  /* ─── NEXT ─────────────────────────────────────────────────── */
  .market{display:flex;align-items:center;gap:12px;padding:12px 13px}
  .market .mnum{font-family:var(--display);font-weight:800;font-size:26px;color:var(--accent);line-height:1}
  .market .mtxt{font-size:10px;color:var(--mute);line-height:1.5}
  .scen{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
  .scenhead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .scenhead .prob{font-family:var(--display);font-weight:800;font-size:16px}
  .scenhead .lab{font-size:11px;font-weight:600;color:var(--bright);letter-spacing:.02em}
  .scenhead .kind{font-size:8px;letter-spacing:.12em;padding:2px 6px;border-radius:3px;margin-left:auto}
  .k-base{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
  .k-risk{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .k-tail{background:color-mix(in srgb,var(--alarm) 14%,transparent);color:var(--alarm)}
  .scen p{font-size:11px;line-height:1.6;color:var(--mute);padding:10px 12px}
  .uaebox{background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
  .uaebox .chead{color:var(--accent)}
  .uaebox p{color:var(--text)}
  .triggers .trow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .triggers .trow:last-child{border-bottom:none}
  .triggers .tmark{font-family:var(--display);font-size:9px;font-weight:800;color:var(--accent);margin-top:2px;min-width:16px}
  .triggers .tt{font-size:11px;color:var(--text);line-height:1.45}
  .triggers .tt b{color:var(--bright);font-weight:600}

  /* ─── PATTERNS ─────────────────────────────────────────────── */
  .pat{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface);overflow:hidden}
  .pathead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .pathead .pname{font-size:11px;font-weight:600;color:var(--bright);flex:1;line-height:1.35}
  .pstate{font-size:8px;font-weight:600;letter-spacing:.1em;padding:3px 7px;border-radius:3px;flex-shrink:0}
  .ps-CONFIRMED{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .ps-ACTIVE{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .ps-STRESSED{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .ps-BROKEN{background:color-mix(in srgb,var(--alarm) 16%,transparent);color:var(--alarm)}
  .ps-HYPOTHESIS{background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--text)}
  .patbody{padding:10px 12px;display:none}
  .pat.open .patbody{display:block}
  .patrule{font-size:10.5px;color:var(--text);line-height:1.55;font-style:italic;margin-bottom:7px}
  .patev{font-size:10px;color:var(--mute);line-height:1.55}
  .pathist{margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
  .phrow{display:flex;gap:8px;padding:3px 0;font-size:9px;align-items:baseline}
  .phrow .phd{color:var(--mute);min-width:56px;letter-spacing:.06em}
  .phrow .phs{font-weight:600;min-width:78px}
  .phrow .phn{color:var(--mute);flex:1}
  /* forecast ledger */
  .ledset{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface);overflow:hidden}
  .ledhead{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:9px;letter-spacing:.14em;color:var(--mute);background:var(--bg)}
  .lrow{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
  .lrow:last-child{border-bottom:none}
  .lrow .lprob{font-family:var(--display);font-weight:800;font-size:13px;min-width:38px}
  .lrow .llab{flex:1;font-size:10.5px;color:var(--bright);line-height:1.4}
  .lrow .llab .lesson{display:block;font-size:9.5px;color:var(--mute);margin-top:4px;line-height:1.5;font-style:italic}
  .obadge{font-size:8px;font-weight:600;letter-spacing:.1em;padding:3px 7px;border-radius:3px;flex-shrink:0}
  .o-HIT{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .o-MISS{background:color-mix(in srgb,var(--alarm) 16%,transparent);color:var(--alarm)}
  .o-PARTIAL{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .o-OPEN{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

  /* ─── SOURCES ──────────────────────────────────────────────── */
  .srch{width:100%;font-family:var(--mono);font-size:10px;color:var(--text);background:var(--surface);
    border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;outline:none}
  .srch::placeholder{color:var(--mute)}
  .srch:focus{border-color:var(--accent)}
  .srow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .srow:last-child{border-bottom:none}
  .stier{flex-shrink:0;width:88px;font-size:7.5px;font-weight:600;letter-spacing:.08em;text-align:center;
    padding:3px 0;border-radius:3px;height:fit-content}
  .st-T2{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
  .st-T1{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
  .st-T1E{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .st-T1U{background:color-mix(in srgb,var(--alarm) 16%,transparent);color:var(--alarm)}
  .st-SPEC{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
  .st-META{background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--text)}
  .sinfo{flex:1;min-width:0}
  .sname{font-size:10.5px;color:var(--bright);font-weight:600}
  .smeta{font-size:8px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
  .snote{font-size:9px;color:var(--mute);line-height:1.5;margin-top:3px}

  /* ─── CONTEXT (trace) ──────────────────────────────────────── */
  .tracewrap{padding:12px 0 6px}
  .tracelbl{display:flex;justify-content:space-between;padding:0 13px 8px;font-size:8.5px;letter-spacing:.16em;color:var(--mute)}
  .tracelbl b{color:var(--hot)}
  svg.trace{display:block;width:100%}
  .gl{stroke:var(--line);stroke-width:.5;stroke-dasharray:2 4}
  .sig-line{fill:none;stroke:var(--text);stroke-width:1.4;stroke-linejoin:round;opacity:.65}
  .sig-hot{fill:none;stroke:var(--hot);stroke-width:1.7;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--hot) 60%,transparent))}
  .evt{font-size:7px;fill:var(--mute);letter-spacing:.08em}
  .evtdot{fill:var(--hot)}
  .nowline{stroke:var(--hot);stroke-width:1;stroke-dasharray:3 3}
  .axis{display:flex;justify-content:space-between;padding:5px 13px 10px;font-size:8px;letter-spacing:.16em;color:var(--mute)}
  .histp{font-size:11px;line-height:1.7;color:var(--text);padding:11px 13px}
  .histp b{color:var(--bright);font-weight:600}
  .miniline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:10.5px}
  .miniline:last-child{border-bottom:none}
  .miniline .mk{color:var(--mute);letter-spacing:.06em;white-space:nowrap}
  .miniline .mv{color:var(--text);text-align:right}

  .foot{text-align:center;font-size:8.5px;letter-spacing:.14em;color:var(--mute);padding:14px 0 6px}
  .loaderr{padding:30px 16px;text-align:center;font-size:11px;line-height:1.7;color:var(--warn)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.sweep{animation:none}.banner .pulse{animation:none}.panel.on{animation:none}}
</style>
</head>
<body>
<div class="phone">
  <!-- HEADER -->
  <div class="top">
    <div class="toprow">
      <div>
        <div class="brand" id="brand">GULF DESK</div>
        <h1>HORMUZ<b>·</b>LIVE</h1>
        <div class="sub" id="subline">LOADING…</div>
      </div>
      <div class="daycol">
        <div class="day" id="daychip">—</div>
        <div class="tchip" id="tchip" style="display:none"></div>
      </div>
    </div>
    <div class="flip">
      <button id="fw" class="on" onclick="setTheme('water')">DARK WATER</button>
      <span class="ico">⇄</span>
      <button id="fp" onclick="setTheme('pressure')">PRESSURE</button>
    </div>
  </div>

  <!-- THESIS BANNER -->
  <div class="banner" id="banner" style="display:none">
    <span class="pulse"></span>
    <div class="b-txt" id="bannertxt"></div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- CONTENT -->
  <div class="wrap">
    <div class="panel on" id="p-wire"></div>
    <div class="panel" id="p-now"></div>
    <div class="panel" id="p-verify"></div>
    <div class="panel" id="p-next"></div>
    <div class="panel" id="p-patterns"></div>
    <div class="panel" id="p-context"></div>
    <div class="panel" id="p-sources"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
/* ════════ HORMUZ·LIVE next-gen template ════════
   All content lives in /data/*.json — this file is layout + render only.
   Theme flip logic is unchanged from the reference build. Do not touch. */

let DATA=null, SOURCES=[], PATTERNS=null, LEDGER=null;
let filter=null, srcTier=null, srcQuery="";

const tierClass={flash:"flashrail",disputed:"disprail",pending:"pendrail",ver2:"verrail",ver:"verrail"};
const tierTag={flash:["FLASH","t-flash"],ver2:["VERIFIED ×2","t-ver2"],ver:["VERIFIED","t-ver"],pending:["PENDING","t-pending"],disputed:["DISPUTED","t-disputed"]};
const srcTierMap={"T2":["T2 · CONFIRM","st-T2"],"T1":["T1 · SPEED","st-T1"],"T1-ELEVATED":["T1 · ELEVATED","st-T1E"],"T1-UNRELIABLE":["T1 · UNRELIABLE","st-T1U"],"SPECIALIST":["SPECIALIST","st-SPEC"],"META":["META","st-META"]};
const srcTierOrder=["T2","T1-ELEVATED","T1","T1-UNRELIABLE","SPECIALIST","META"];

/* ── data loading (works at Vercel root and local static serve) ── */
async function loadJSON(name){
  const paths=["/data/"+name,"../data/"+name,"./data/"+name];
  for(const p of paths){
    try{
      const r=await fetch(p,{cache:"no-store"});
      if(r.ok) return await r.json();
    }catch(e){/* try next path */}
  }
  throw new Error("could not load "+name);
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ════════ HEADER ════════ */
function renderHeader(){
  const m=DATA.meta;
  document.getElementById("brand").textContent=m.coords;
  document.getElementById("subline").textContent=m.subline;
  document.getElementById("daychip").textContent="DAY "+m.day;
  if(m.deadline&&m.deadline.date){
    const days=Math.ceil((new Date(m.deadline.date+"T00:00:00Z")-Date.now())/86400000);
    const chip=document.getElementById("tchip");
    if(days>0){chip.style.display="block";chip.textContent="T−"+days+" · "+m.deadline.label;}
    else{chip.style.display="block";chip.textContent=m.deadline.label+" — EXPIRED";chip.style.color="var(--alarm)";}
  }
  const b=m.banner;
  if(b&&b.html){
    const el=document.getElementById("banner");
    el.style.display="flex";
    el.classList.remove("warn","alarm");
    if(b.level==="warn"||b.level==="alarm") el.classList.add(b.level);
    document.getElementById("bannertxt").innerHTML=b.html;
  }
  document.getElementById("foot").textContent="HORMUZ·LIVE · DAY "+m.day+" · "+m.updated+" · SPEED FIRST, VERIFY SECOND, FORECAST THIRD";
}

/* ════════ TABS ════════ */
function tabDefs(){
  return [
    {id:"wire",label:"WIRE",n:DATA.wire.length},
    {id:"now",label:"NOW"},
    {id:"verify",label:"VERIFY",n:DATA.verify.length},
    {id:"next",label:"NEXT"},
    {id:"patterns",label:"PATTERNS",n:PATTERNS.patterns.length},
    {id:"context",label:"CONTEXT"},
    {id:"sources",label:"SOURCES",n:SOURCES.length},
  ];
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=tabDefs().map((t,i)=>
    `<button class="tab ${i===0?'on':''}" data-tab="${t.id}" onclick="go('${t.id}',this)">${t.label}${t.n?`<span class="n">${t.n}</span>`:''}</button>`).join("");
}
function go(id,el){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
  document.getElementById("p-"+id).classList.add("on");
}

/* ════════ WIRE ════════ */
function renderWire(){
  const items=DATA.wire.filter(w=>!filter||w.tier===filter);
  const fbtns=[["ALL",null],["FLASH","flash"],["VERIFIED","ver2"],["DISPUTED","disputed"],["PENDING","pending"]]
    .map(([lab,val])=>`<button class="fbtn ${(filter===val||(val===null&&!filter))?'on':''}" onclick="setFilter(${val?`'${val}'`:'null'})">${lab}</button>`).join("");
  const list=items.map(w=>{
    const[tt,tc]=tierTag[w.tier]||["—","t-geo"];
    return `<div class="ping ${tierClass[w.tier]||''}" onclick="this.classList.toggle('open')">
      <div class="gutter"><div class="g-t">${w.t}</div><div class="g-d">${w.d}</div></div>
      <div class="pbody">
        <div class="ptags"><span class="tag ${tc}">${tt}</span><span class="tag t-geo">${w.geo}</span><span class="src">${w.src}</span></div>
        <div class="ptitle">${w.title}</div>
        <div class="pfull">${w.full}<span class="why">↳ ${w.why}</span></div>
      </div></div>`;
  }).join("");
  document.getElementById("p-wire").innerHTML=
    `<div class="wirehead"><span class="meta">${items.length} CONTACTS · LAST 7 DAYS · TAP TO EXPAND</span></div>
     <div class="filters">${fbtns}</div>${list}`;
}
function setFilter(v){filter=v;renderWire();}

/* ════════ NOW ════════ */
function renderNow(){
  const s=DATA.strait||{};
  const statlines=DATA.status.map(x=>
    `<div class="statline"><span class="dot" style="background:var(--${x.c})"></span>
     <div><div class="sl-k">${x.k}</div><div class="sl-v">${x.v}</div></div></div>`).join("");
  const gauges=DATA.gauges.map(g=>`<div class="gauge"><div class="gv c-${g.c}">${g.v}</div><span class="gl">${g.l}</span></div>`).join("");
  const dials=DATA.dials.map(d=>
    `<div class="dial"><div class="needlebox"><div class="arc"></div><div class="pin" style="transform:translateX(-50%) rotate(${d.rot}deg)"></div></div>
     <div class="dv c-${d.c}">${d.v}</div><span class="dl">${d.l}</span></div>`).join("");
  const vessels=(s.vessels||[]).map(v=>
    `<div class="vessel${v.uturn?' uturn':''}" style="left:${v.left};top:${v.top}px"></div>`).join("");
  const cors=(s.corridors||[]).map(c=>{
    const y=c.pos==="top"?40:86, ly=c.pos==="top"?29:103;
    return `<div class="cor ${c.cls}" style="top:${y}px"></div>
      <div class="corlbl ${c.cls}" style="top:${ly}px;left:7%">${c.label}</div>`;
  }).join("");
  document.getElementById("p-now").innerHTML=`
    <div class="card flag">
      <div class="chead"><span>STRAIT STATE</span><span class="stamp" style="color:var(--${s.stampColor||'alarm'})">${s.stamp||''}</span></div>
      <div class="sig-water"><div class="channel"><div class="chart">
        <div class="land iran"></div><div class="landlbl" style="top:8px;left:13px">IRAN</div>
        <div class="land oman"></div><div class="landlbl" style="bottom:6px;right:13px">OMAN · MUSANDAM</div>
        <div class="tss"></div><div class="tsslbl">${s.tsslbl||''}</div>
        ${cors}${vessels}
        <div class="sweep"></div>
      </div></div></div>
      <div class="sig-pressure"><div class="dials">${dials}</div></div>
      <div class="gauges">${gauges}</div>
    </div>
    <div class="card"><div class="chead">CURRENT POSTURE — Updated ${DATA.meta.updated}</div>
      <div class="cbody">${statlines}</div></div>`;
}

/* ════════ VERIFY ════════ */
function renderVerify(){
  const blocks=DATA.verify.map(v=>{
    const rows=v.rows.map(r=>
      `<div class="vrow"><span class="vbadge ${r.cls}">${r.verdict.toUpperCase()}</span>
        <div class="vtext"><div class="vc">${r.c}</div><div class="vn">${r.n}</div><div class="vs">${r.src.replace(/VERIFIED[^·]*/,m=>`<b>${m}</b>`)}</div></div></div>`).join("");
    return `<div class="card flag">
      <div class="claimsrc"><div class="avatar">${v.avatar}</div>
        <div><div class="who">${v.who}</div><div class="handle">${v.handle}</div></div>
        <div class="reach">${v.reach}</div></div>
      <div class="claimquote">${v.quote}</div>
      <div class="verdict">${rows}</div></div>`;
  }).join("");
  document.getElementById("p-verify").innerHTML=
    `<div class="wirehead"><span class="meta">CLAIMS IN MOTION · SPEED-FIRST, THEN GRADED</span></div>${blocks}`;
}

/* ════════ NEXT ════════ */
function renderNext(){
  const scen=DATA.scenarios.map(s=>
    `<div class="scen"><div class="scenhead"><span class="prob c-${s.kind==='base'?'ok':s.kind==='risk'?'warn':'alarm'}">${s.prob}</span>
      <span class="lab">${s.lab}</span><span class="kind ${s.cls}">${s.kind.toUpperCase()}</span></div>
      <p>${s.p}</p></div>`).join("");
  const trig=DATA.triggers.map(t=>`<div class="trow"><span class="tmark">${t.m}</span><span class="tt">${t.t}</span></div>`).join("");
  document.getElementById("p-next").innerHTML=`
    <div class="card"><div class="chead">MARKET-IMPLIED — next 24h read</div>
      <div class="market"><div class="mnum">${DATA.market.num}</div><div class="mtxt">${DATA.market.txt}</div></div></div>
    <div class="wirehead"><span class="meta">SCENARIOS · WEIGHTED · NEXT 24–72H · ANALYTICAL JUDGMENT, NOT SOURCED FACT</span></div>
    ${scen}
    <div class="card uaebox"><div class="chead">WHAT THIS MEANS FOR YOU · UAE</div>
      <div class="cbody" style="font-size:11.5px;line-height:1.7;color:var(--text)">${DATA.uae_means}</div></div>
    <div class="card"><div class="chead">TRIGGERS TO WATCH</div>
      <div class="cbody triggers">${trig}</div></div>`;
}

/* ════════ PATTERNS + FORECAST LEDGER ════════ */
function renderPatterns(){
  const pats=PATTERNS.patterns.map(p=>{
    const hist=(p.history||[]).map(h=>
      `<div class="phrow"><span class="phd">${h.date}</span><span class="phs ps-${h.state}" style="background:none;padding:0">${h.state}</span><span class="phn">${h.note}</span></div>`).join("");
    return `<div class="pat" onclick="this.classList.toggle('open')">
      <div class="pathead"><span class="pname">${p.name}</span><span class="pstate ps-${p.state}">${p.state}</span></div>
      <div class="patbody">
        <div class="patrule">RULE: ${p.rule}</div>
        <div class="patev">${p.evidence}</div>
        <div class="pathist">${hist}</div>
      </div></div>`;
  }).join("");
  const sets=LEDGER.ledger.map(set=>{
    const rows=set.entries.map(e=>{
      const pc=e.kind==="base"?"ok":e.kind==="risk"?"warn":"alarm";
      return `<div class="lrow"><span class="lprob c-${pc}">${e.prob}</span>
        <span class="llab">${e.lab}${e.lesson?`<span class="lesson">↳ ${e.lesson}</span>`:''}</span>
        <span class="obadge o-${e.outcome}">${e.outcome}</span></div>`;
    }).join("");
    return `<div class="ledset">
      <div class="ledhead"><span>ISSUED ${set.issued} · ${set.horizon}</span><span>${set.graded?`GRADED ${set.graded}`:'OPEN'}</span></div>
      ${rows}</div>`;
  }).join("");
  const graded=LEDGER.ledger.flatMap(s=>s.entries).filter(e=>e.outcome!=="OPEN");
  const hits=graded.filter(e=>e.outcome==="HIT").length;
  const partials=graded.filter(e=>e.outcome==="PARTIAL").length;
  const score=graded.length?`${hits} HIT · ${partials} PARTIAL · ${graded.length-hits-partials} MISS of ${graded.length} graded`:"no graded forecasts yet";
  document.getElementById("p-patterns").innerHTML=`
    <div class="wirehead"><span class="meta">LEARNED PATTERNS · STATE MACHINE · TAP TO EXPAND</span></div>
    ${pats}
    <div class="wirehead" style="margin-top:14px"><span class="meta">FORECAST LEDGER · EVERY CALL GRADED ON EXPIRY · ${score}</span></div>
    ${sets}
    <div class="card"><div class="cbody" style="font-size:9.5px;line-height:1.6;color:var(--mute)">${PATTERNS.meta.doctrine}</div></div>`;
}

/* ════════ SOURCES ════════ */
function renderSources(){
  const q=srcQuery.trim().toLowerCase();
  const items=SOURCES.filter(s=>
    (!srcTier||s.tier===srcTier)&&
    (!q||(s.name+" "+s.domain+" "+s.geography+" "+(s.notes||"")).toLowerCase().includes(q)));
  const counts={};SOURCES.forEach(s=>counts[s.tier]=(counts[s.tier]||0)+1);
  const fbtns=[["ALL",null],...srcTierOrder.map(t=>[t.replace("-ELEVATED","·EL").replace("-UNRELIABLE","·UN")+" "+(counts[t]||0),t])]
    .map(([lab,val])=>`<button class="fbtn ${(srcTier===val||(val===null&&!srcTier))?'on':''}" onclick="setSrcTier(${val?`'${val}'`:'null'})">${lab}</button>`).join("");
  const groups=srcTierOrder.filter(t=>items.some(s=>s.tier===t)).map(t=>{
    const[tl]=srcTierMap[t];
    const rows=items.filter(s=>s.tier===t).map(s=>{
      const[lab,cls]=srcTierMap[s.tier]||[s.tier,"st-META"];
      return `<div class="srow"><span class="stier ${cls}">${lab}</span>
        <div class="sinfo"><div class="sname">${esc(s.name)}</div>
        <div class="smeta">${esc(s.platform)} · ${esc(s.language)} · ${esc(s.domain)} · ${esc(s.geography)} · ${esc(s.role).toUpperCase()}</div>
        ${s.notes?`<div class="snote">${esc(s.notes)}</div>`:''}</div></div>`;
    }).join("");
    return `<div class="card"><div class="chead"><span>${tl}</span><span class="stamp">${items.filter(s=>s.tier===t).length}</span></div>
      <div class="cbody">${rows}</div></div>`;
  }).join("");
  document.getElementById("p-sources").innerHTML=`
    <div class="wirehead"><span class="meta">${items.length} OF ${SOURCES.length} REGISTERED SOURCES · THE VERIFICATION MACHINE, VISIBLE</span></div>
    <input class="srch" type="search" placeholder="search name, domain, geography, notes…" value="${esc(srcQuery)}" oninput="setSrcQuery(this.value)">
    <div class="filters">${fbtns}</div>${groups}`;
  const inp=document.querySelector("#p-sources .srch");
  if(q&&inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
}
function setSrcTier(v){srcTier=v;renderSources();}
function setSrcQuery(v){srcQuery=v;renderSources();}

/* ════════ CONTEXT ════════ */
function renderContext(){
  const tr=DATA.trace;
  const lines=tr.lines.map(l=>`<polyline class="${l.cls}" points="${l.points}"/>`).join("");
  const evts=tr.events.map(e=>
    `<circle class="evtdot" cx="${e.x}" cy="${e.y}" r="2.5"/><text class="evt" x="${e.lx}" y="${e.ly}">${e.label}</text>`).join("");
  const axis=tr.axis.map(a=>`<span>${a}</span>`).join("");
  document.getElementById("p-context").innerHTML=`
    <div class="card">
      <div class="tracewrap">
        <div class="tracelbl"><span>${tr.label}</span><b>${tr.sublabel}</b></div>
        <svg class="trace" viewBox="0 0 400 112">
          <line class="gl" x1="0" y1="30" x2="400" y2="30"/><line class="gl" x1="0" y1="60" x2="400" y2="60"/><line class="gl" x1="0" y1="90" x2="400" y2="90"/>
          ${lines}${evts}
          <line class="nowline" x1="396" y1="6" x2="396" y2="106"/>
        </svg>
        <div class="axis">${axis}</div>
      </div>
    </div>
    <div class="card"><div class="chead">HOW WE GOT HERE</div><div class="histp">${DATA.hist}</div></div>
    <div class="card"><div class="chead">TIMELINE</div><div class="cbody">
      ${DATA.mini.map(m=>`<div class="miniline"><span class="mk">${m.k}</span><span class="mv">${m.v}</span></div>`).join("")}
    </div></div>`;
}

/* ════════ THEME FLIP — unchanged, do not touch ════════ */
function setTheme(name){
  document.documentElement.setAttribute("data-theme",name);
  document.getElementById("fw").classList.toggle("on",name==="water");
  document.getElementById("fp").classList.toggle("on",name==="pressure");
}

/* ════════ INIT ════════ */
async function init(){
  try{
    const[d,s,p,l]=await Promise.all([
      loadJSON("data.json"),loadJSON("sources.json"),loadJSON("patterns.json"),loadJSON("scenarios.json")]);
    DATA=d;SOURCES=s;PATTERNS=p;LEDGER=l;
    renderHeader();renderTabs();renderWire();renderNow();renderVerify();renderNext();renderPatterns();renderContext();renderSources();
  }catch(err){
    document.getElementById("subline").textContent="DATA LOAD FAILED";
    document.getElementById("p-wire").innerHTML=
      `<div class="loaderr">Could not load /data/*.json.<br>Serve the repo root over HTTP (e.g. <b>python3 -m http.server</b> from the repository root, then open /site/) — fetch() cannot read local files over file://.<br><br>${esc(err.message)}</div>`;
  }
}
init();
</script>
</body>
</html>
