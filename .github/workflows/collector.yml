name: raw-feed collector
# Collects the RAW lane and COMMITS it, so the page updates with no Claude session
# in the path. A run that cannot save its output fails red.
#
# Kept after the 13–15 Oct experiment (owner decision 16 Oct 2026). Runs hourly on
# GitHub's schedule AND is dispatched by the scheduled Claude session after it has
# written translations / search results — GitHub delays its own schedule (the
# experiment got 4 runs of ~12), so two triggers keep the page under the 3h STALE mark.
#
# The Claude session writes ONLY to collector/data/inbox/ on branch claude/inbox. This
# workflow reads that branch; it never merges it.
on:
  workflow_dispatch:
  # PAUSED 17 Oct 2026 (owner) while the search design is reworked.
  # To resume: uncomment the two lines below; change the cron to set frequency
  # ("23 */6 * * *" = every 6h at :23 UTC). Manual runs still work while paused.
  # schedule:
  #   - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: raw-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Selftests (fail fast)
        run: |
          for s in web-social-feed collector story-grading translate-check military-trackers inbox story-clustering feed-parser; do node collector/scripts/$s.mjs --selftest > /dev/null || { node collector/scripts/$s.mjs --selftest; exit 1; }; done
          echo "selftests passed"

      - name: Read the Claude session's inbox (translations, search results)
        run: |
          mkdir -p .inbox
          if git fetch -q --depth=1 origin claude/inbox 2>/dev/null; then
            for f in translations.json exa-feed.json; do
              git show "FETCH_HEAD:collector/data/inbox/$f" > ".inbox/$f" 2>/dev/null || rm -f ".inbox/$f"
            done
            echo "inbox: $(ls .inbox | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "inbox: branch claude/inbox not found — collecting without it" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect raw feed
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
        run: node collector/scripts/collector.mjs --hours 12 --inbox "$PWD/.inbox" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Grade items older than 24h
        run: node collector/scripts/story-grading.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate
        run: node collector/scripts/validate.mjs

      - name: Commit and push (a failed save fails the run)
        run: |
          git config user.name  "raw-feed-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/data/news-collector.json collector/data/de-dupe.json collector/data/to-translate.json collector/data/tracker-list.json collector/data/source-retire.json collector/data/sources.json
          if git diff --cached --quiet; then
            echo "No change to commit." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          runs=$(node -e "console.log(require('./collector/data/news-collector.json').meta.runs)")
          gst=$(TZ=Asia/Dubai date '+%d %b %H:%M GST')
          git commit -q -m "feed: run $runs — $gst"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "Saved to main (run $runs)." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep $((i * 5)); git pull --rebase origin main
          done
          echo "::error::Push failed 3 times — output NOT saved"; exit 1
