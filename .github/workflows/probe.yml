name: probe
# Adapter test loop for source activation. Runs scripts/probe.mjs ALONE — no gather,
# no Perplexity, no secret, no credit spend. Exists because adapters must be written
# blind (the session sandbox cannot reach news/AIS/advisory hosts) and proving one
# previously cost a full gather run. Batches ~60 targets per run so activating the
# registry costs a couple of cycles instead of dozens.
on:
  workflow_dispatch:
  push:
    branches: [claude/signals-live-layer]
    paths:
      - scripts/probe.mjs
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe targets (reachability · declared feeds · shape)
        run: node scripts/probe.mjs

      # Reachability is not readability. This asks the separate question: do the
      # dashboard pages actually carry their FIGURES in the served markup, or is
      # the number painted client-side where a plain fetch can never see it?
      - name: Comprehension probe (are the numbers readable?)
        run: node scripts/probe.mjs --comprehend

      # The 45 registry entries that have a URL but no reader, all at h0/m0 — never
      # fetched once. Highest-yield run available: a declared feed here converts an
      # entry directly onto the rss route, the only route performing at 14/15.
      - name: Connect probe (45 never-attempted sources)
        run: node scripts/probe.mjs --connect
