name: prune archived branches (one-shot)
# The cloud sandbox cannot delete branches, so this runs it from GitHub's side.
# Each branch is deleted only if its tip is preserved in claude/archive-old-branches.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches preserved in the archive
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          for b in conflict-tracker-gather-layer-xhd6lz day196-deep-research-update design-lab-archive \
                   fix-hero-content-and-layout fix-vercel-output-dir flatten-to-root \
                   hormuz-live-tracker-update-vd6731 seismograph-v2-design-mm12b5 signals-live-layer; do
            ref="origin/claude/$b"
            if ! git rev-parse -q --verify "$ref" >/dev/null; then echo "already gone: $b"; continue; fi
            if git merge-base --is-ancestor "$ref" origin/claude/archive-old-branches; then
              git push origin --delete "claude/$b" && echo "deleted: $b" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::kept claude/$b — not preserved in the archive branch"
            fi
          done
