name: delete branches (manual)
# The cloud sandbox cannot delete branches, so this runs it from GitHub's side.
# Give branch names separated by spaces. main, claude/inbox and claude/design-lab are
# refused, whatever is typed.
on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Branch names to delete, space-separated"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the named branches
        env:
          BRANCHES: ${{ inputs.branches }}
        run: |
          for b in $BRANCHES; do
            case "$b" in
              main|claude/inbox|claude/design-lab) echo "::warning::refused: $b is protected"; continue ;;
            esac
            if ! git ls-remote --exit-code --heads origin "$b" >/dev/null; then echo "already gone: $b"; continue; fi
            git push origin --delete "$b" && echo "deleted: $b" | tee -a "$GITHUB_STEP_SUMMARY"
          done
