name: social-fetch
# Telegram DIRECT engine — proves the runner can reach + parse t.me/s (the
# real-time L3 pipe), then walks the registry's wired channels. No secret: t.me/s
# is public, no auth. The build sandbox cannot reach t.me — this is where "does
# it actually work" gets answered, same as the Perplexity smoke.
on:
  workflow_dispatch:
  # The fast lane fired on push only, so it stopped whenever nobody committed —
  # which is exactly how the page reached Day 150 while the world reached 154.
  # An early-warning tracker cannot depend on someone happening to commit.
  schedule:
    - cron: "*/30 * * * *"

  push:
    branches: [claude/signals-live-layer]
    paths:
      - scripts/telegram.mjs
      - scripts/read.mjs
      - scripts/flash.mjs
      - .github/workflows/social-fetch.yml
      - data/sources.json
jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Telegram t.me/s reachability smoke
        run: node scripts/telegram.mjs --smoke
      - name: Telegram DIRECT gather (registry channels)
        run: node scripts/telegram.mjs --gather
      - name: Score channels (emit SCOREBOARD for the scoring loop)
        run: node scripts/telegram.mjs --score
      - name: RSS read (single reader engine — expert/military/naval + wires)
        run: node scripts/read.mjs --rss
      - name: JSON read (free TRACK APIs — ADS-B over the Gulf)
        run: node scripts/read.mjs --json
      - name: HTML read (sites with no feed — generic JSON-LD/time extraction)
        run: node scripts/read.mjs --html
# dispatch: fresh gather 2026-07-24T05:17Z
# dispatch: fresh gather 2026-07-24T08:04Z
# dispatch: fresh gather 2026-07-26T08:12Z

      # FAST LANE. Runs last so the claims ledger is written against the freshest
      # registry state. One source is enough here — no corroboration gate — because
      # a single scattered claim inside the window is exactly the thing this tracker
      # exists to catch. The 24h resolve pass is what keeps that honest.
      - name: FLASH (fast lane — novel claims inside a 6h window)
        run: node scripts/flash.mjs --selftest && node scripts/flash.mjs --hours 12
